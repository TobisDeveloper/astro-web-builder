name: Windows desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested Windows downloads to GitHub Releases
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read and validate app version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_TAG_NAME -ne "v$version") { throw 'Release tag must match package.json version.' }
      - run: npm ci
      - run: npm run test:desktop-tools
      - run: npm run desktop:doctor
      - run: npm run desktop:install
      - run: npm run build
      - run: npm run test:install
      - run: npm test
      - name: Build installer and portable app
        run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the packaged Windows app
        run: npm run test:desktop
        env:
          FORMA_DESKTOP_EXECUTABLE: release/win-unpacked/Forma.exe
      - name: Create download checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Forma-Windows-x64
          path: release
      - name: Publish Windows downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: Forma v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Forma for Windows (64-bit): visual Astro designer, custom fonts, and brand kits.

            Download **Forma-Setup** to install, or **Forma-Portable** to run without installation.
            No Node.js or development server is needed to use the app. Projects are saved locally; use project backups to transfer work from the browser.

            These builds are unsigned. Windows may show a SmartScreen notice because there is no signing certificate yet.
